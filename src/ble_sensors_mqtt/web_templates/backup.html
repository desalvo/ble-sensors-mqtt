{% extends 'base.html' %}{% block content %}<section class="page-head"><div><h1>Backup / Restore</h1><p>Encrypted export of configuration, user profiles/MFA and available runtime cache/state.</p></div></section><div class="two-col"><form method="post" class="panel"><input type="hidden" name="csrf_token" value="{{csrf_token}}"><input type="hidden" name="action" value="export"><h2>Export</h2><label>Backup passphrase<input type="password" name="password" minlength="10" required></label><p class="hint">The backup can contain password hashes and MFA seeds; encryption is mandatory.</p><button>Download encrypted backup</button></form><form method="post" enctype="multipart/form-data" class="panel"><input type="hidden" name="csrf_token" value="{{csrf_token}}"><input type="hidden" name="action" value="import"><h2>Import</h2><label>Backup file<input type="file" name="backup" accept=".bsmqbackup" required></label><label>Backup passphrase<input type="password" name="password" minlength="10" required></label><button>Import and restore</button></form></div>{% endblock %}
