apiVersion: apps/v1
kind: Deployment
metadata:
  name: ble-sensors-mqtt
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/name: ble-sensors-mqtt}
  template:
    metadata:
      labels: {app.kubernetes.io/name: ble-sensors-mqtt}
    spec:
      securityContext:
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
      nodeSelector: {ble-sensors-mqtt/bluetooth: "true"}
      containers:
        - name: ble-sensors-mqtt
          image: desalvo/ble-sensors-mqtt:1.0.0
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef: {name: ble-sensors-mqtt}
          env:
            - name: DBUS_SYSTEM_BUS_ADDRESS
              value: unix:path=/run/dbus/system_bus_socket
            - name: MQTT_USERNAME
              valueFrom:
                secretKeyRef: {name: ble-sensors-mqtt-secrets, key: MQTT_USERNAME, optional: true}
          ports:
            - {name: prometheus, containerPort: 9105, protocol: TCP}
            - {name: snmp, containerPort: 1161, protocol: UDP}
          volumeMounts:
            - {name: dbus, mountPath: /run/dbus, readOnly: true}
            - {name: state, mountPath: /var/lib/ble-sensors-mqtt}
            - {name: secrets, mountPath: /run/secrets, readOnly: true}
            - {name: arguments, mountPath: /etc/ble-sensors-mqtt, readOnly: true}
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          livenessProbe:
            httpGet: {path: /healthz, port: prometheus}
            initialDelaySeconds: 15
            periodSeconds: 30
          readinessProbe:
            httpGet: {path: /readyz, port: prometheus}
            initialDelaySeconds: 10
            periodSeconds: 15
      volumes:
        - name: dbus
          hostPath: {path: /run/dbus, type: Directory}
        - name: state
          persistentVolumeClaim: {claimName: ble-sensors-mqtt-state}
        - name: secrets
          secret: {secretName: ble-sensors-mqtt-secrets, optional: true, defaultMode: 0440}
        - name: arguments
          configMap: {name: ble-sensors-mqtt-arguments, optional: true}
