[build-system]
requires = ["setuptools>=83"]
build-backend = "setuptools.build_meta"

[project]
name = "ble-sensors-mqtt"
version = "1.0.0"
description = "Plugin-based BLE/cloud sensor gateway for MQTT, Prometheus, and SNMP"
readme = "README.en.md"
requires-python = ">=3.11"
license = "EUPL-1.2"
authors = [{name = "Alessandro De Salvo", email = "braket71@gmail.com"}]
keywords = ["bluetooth", "ble", "mqtt", "prometheus", "snmp", "sensors", "iot"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: No Input/Output (Daemon)",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Home Automation",
  "Topic :: System :: Monitoring",
]
dependencies = [
  "bleak>=2.1,<4",
  "paho-mqtt>=2.1,<3",
  "PySwitchbot>=2.0,<3",
]

[project.optional-dependencies]
sensors = [
  "airthings-ble>=1.2,<2",
  "bthome-ble>=3.24,<4",
  "govee-ble>=1.4,<2",
  "inkbird-ble>=1.7,<2",
  "mopeka-iot-ble>=1,<2",
  "qingping-ble>=1.1,<2",
  "ruuvitag-sensor>=4.1,<5",
  "sensorpush-ble>=1.9,<2",
  "thermopro-ble>=1.1,<2",
  "xiaomi-ble>=1.16,<2",
]
cloud = ["tinytuya>=1.17,<2"]
all = [
  "airthings-ble>=1.2,<2", "bthome-ble>=3.24,<4", "govee-ble>=1.4,<2",
  "inkbird-ble>=1.7,<2", "mopeka-iot-ble>=1,<2", "qingping-ble>=1.1,<2",
  "ruuvitag-sensor>=4.1,<5", "sensorpush-ble>=1.9,<2", "thermopro-ble>=1.1,<2",
  "tinytuya>=1.17,<2", "xiaomi-ble>=1.16,<2",
]
dev = [
  "bandit[toml]>=1.8,<2",
  "pip-audit>=2.10,<3",
  "pytest>=9.0,<10",
  "pytest-cov>=7,<8",
  "reportlab>=4.2,<5",
  "ruff>=0.12,<1",
]
release = ["build>=1.6,<2", "twine>=7,<8"]

[project.urls]
Homepage = "https://github.com/desalvo/ble-sensors-mqtt"
Repository = "https://github.com/desalvo/ble-sensors-mqtt"
Issues = "https://github.com/desalvo/ble-sensors-mqtt/issues"

[project.scripts]
ble-sensors-mqtt = "ble_sensors_mqtt.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-config --strict-markers"

[tool.coverage.run]
branch = true
source = ["ble_sensors_mqtt"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.bandit]
exclude_dirs = ["tests"]
