name: test-build-security

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip "setuptools>=83" wheel
      - run: python -m pip install -e '.[all,dev]'
      - run: ruff check .
      - run: pytest --cov=ble_sensors_mqtt --cov-report=term-missing
      - run: bandit -c pyproject.toml -r src
      - run: pip-audit

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip "setuptools>=83" wheel
      - run: python -m pip install '.[all,dev,release]'
      - run: ./scripts/release-check.sh
      - name: Build deterministic deployment archives
        run: |
          export SOURCE_DATE_EPOCH="$(git log -1 --pretty=%ct)"
          RELEASE_DIR=release ./scripts/build-package.sh
      - name: Create release checksums
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          from pathlib import Path

          root = Path.cwd()
          candidates = [
              *sorted((root / "dist").glob("*")),
              *sorted((root / "release").glob("*")),
              *sorted((root / "docs").glob("ble-sensors-mqtt-manual-*.pdf")),
          ]
          files = [
              path
              for path in candidates
              if path.is_file()
              and path.name != "SHA256SUMS.txt"
              and not path.name.endswith(".sha256")
          ]
          lines = []
          for path in files:
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              lines.append(f"{digest}  {path.name}")
          output = root / "release" / "SHA256SUMS.txt"
          output.write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: ble-sensors-mqtt-dist
          if-no-files-found: error
          retention-days: 30
          path: |
            dist/*
            release/*
            docs/ble-sensors-mqtt-manual-*.pdf

  docker-image:
    if: >-
      vars.DOCKERHUB_PUSH_ENABLED == 'true' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: [test, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Resolve Docker tags
        id: image
        shell: bash
        run: |
          set -euo pipefail
          image="desalvo/ble-sensors-mqtt"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
            test "$version" = "$(tr -d '[:space:]' < VERSION)"
            echo "tags=$image:$version" >> "$GITHUB_OUTPUT"
            echo "version=$version" >> "$GITHUB_OUTPUT"
          else
            echo "tags=$image:latest" >> "$GITHUB_OUTPUT"
            echo "version=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.tags }}
          build-args: VERSION=${{ steps.image.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  native-package:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, build]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            suffix: windows-x86_64
          - os: macos-26
            suffix: macos-tahoe-arm64
          - os: macos-26-intel
            suffix: macos-tahoe-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Verify tag matches VERSION
        run: python scripts/verify-tag-version.py
      - name: Install native builder and core runtime
        run: python -m pip install --upgrade pip "setuptools>=83" wheel ".[native]"
      - name: Install Inno Setup on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command ISCC.exe -ErrorAction SilentlyContinue)) {
            choco install innosetup --no-progress -y
          }
      - name: Install optional sensor/cloud dependencies where supported
        run: python scripts/install-native-optionals.py
      - name: Build and smoke-test native bundle
        run: python scripts/build-native-package.py --artifact-suffix ${{ matrix.suffix }}
      - uses: actions/upload-artifact@v7
        with:
          name: ble-sensors-mqtt-native-${{ matrix.suffix }}
          if-no-files-found: error
          retention-days: 30
          path: |
            native-dist/*.zip
            native-dist/*.exe
            native-dist/*.pkg
            native-dist/*.sha256

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, build, native-package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Verify tag matches project version
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          case "$tag" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "Unsupported release tag: $tag" >&2; exit 1 ;;
          esac
          tag_version="${tag#v}"
          file_version="$(tr -d '[:space:]' < VERSION)"
          project_version="$(python - <<'PY'
          import tomllib
          from pathlib import Path
          data = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          print(data["project"]["version"])
          PY
          )"
          test "$tag_version" = "$file_version" || {
            echo "Tag version $tag_version != VERSION $file_version" >&2
            exit 1
          }
          test "$tag_version" = "$project_version" || {
            echo "Tag version $tag_version != pyproject.toml $project_version" >&2
            exit 1
          }
      - uses: actions/download-artifact@v8
        with:
          name: ble-sensors-mqtt-dist
          path: release-assets
      - uses: actions/download-artifact@v8
        with:
          pattern: ble-sensors-mqtt-native-*
          path: release-assets
          merge-multiple: true
      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mapfile -d '' assets < <(find release-assets -type f -print0 | sort -z)
          if ((${#assets[@]} == 0)); then
            echo "No release assets were downloaded" >&2
            exit 1
          fi
          printf 'Release assets:\n'
          printf '  %s\n' "${assets[@]}"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
              --verify-tag \
              --title "ble-sensors-mqtt $GITHUB_REF_NAME" \
              --generate-notes
          fi
