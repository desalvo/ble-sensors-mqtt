name: test-build-security

on:
  push:
  pull_request:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[all,dev]'
      - run: ruff check .
      - run: pytest --cov=ble_sensors_mqtt --cov-report=term-missing
      - run: bandit -c pyproject.toml -r src
      - run: pip-audit

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install '.[all,dev,release]'
      - run: ./scripts/release-check.sh
      - name: Build deterministic deployment archives
        run: |
          export SOURCE_DATE_EPOCH="$(git log -1 --pretty=%ct)"
          RELEASE_DIR=release ./scripts/build-package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ble-sensors-mqtt-dist
          path: |
            dist/*
            release/*
            docs/ble-sensors-mqtt-manual-*.pdf
